# dx（Dioxus の CLI）の設定（v3 R-02・R-03）
[application]
name = "mdview"
# アイコンを mdview のものにするため、AndroidManifest.xml は自前の写しを使う（v3.1 R-02。中の注釈）
android_manifest = "AndroidManifest.xml"

[bundle]
identifier = "jp.mdview.mobile"
publisher = "mdview"
short_description = "Markdown を読む・軽く直す"

[android]
min_sdk = 26
target_sdk = 35

[ios]
deployment_target = "16.0"
