<?xml version="1.0" encoding="UTF-8"?>
<!--
  関連付けた文書（.md / .markdown）のアイコン。

  **アプリのアイコンとは別にする。** 同じ絵にすると、エクスプローラーで
  「アプリ本体」と「文書」の区別がつかない。地を白い紙にし、
  アプリの印（下向き矢印）を小さく重ねる。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 紙。右上を折る -->
  <path d="M104 48 h208 l96 96 v304 a24 24 0 0 1 -24 24 h-280 a24 24 0 0 1 -24 -24 v-376 a24 24 0 0 1 24 -24 z"
        fill="#FFFFFF" stroke="#C3CBD6" stroke-width="12"/>
  <path d="M312 48 l96 96 h-96 z" fill="#DCE3EC"/>

  <!-- 本文を思わせる線。**3 本だけ**（増やすと小さいとき潰れる） -->
  <g fill="#C3CBD6">
    <rect x="144" y="196" width="180" height="20" rx="10"/>
    <rect x="144" y="248" width="224" height="20" rx="10"/>
    <rect x="144" y="300" width="140" height="20" rx="10"/>
  </g>

  <!-- アプリの印 -->
  <circle cx="356" cy="356" r="104" fill="#3C6CB0"/>
  <path d="M332 296 h48 v56 h36 l-60 68 -60 -68 h36 z" fill="#FFFFFF"/>
</svg>
