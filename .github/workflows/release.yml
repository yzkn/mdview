name: Release

# 3 OS の配布物を作る（§27）。
#
# **押すたびには走らせない。** リリースビルドは 3 OS ぶんで 30 分以上かかる。
#
#   - `v<major>.<minor>.0` のタグ（プレリリース `-alpha.1` 等を含む）
#     = **マイナー以上の更新のときだけ**自動で走る
#   - それ以外（緊急のパッチ配布など）は「Actions」から手動で起動する
#
# **署名はしない**（§27.4）。受け取った側の警告の外し方は Release の説明文に入れる。

on:
  push:
    tags:
      # v2.1.0 / v2.1.0-alpha.1 は当たる。v2.1.3 は当たらない（手動で起動する）
      - "v[0-9]+.[0-9]+.0"
      - "v[0-9]+.[0-9]+.0-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "配布するタグ（例: v2.0.1）。空なら起動したブランチの先頭を使う"
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ビルド（${{ matrix.label }}）
    runs-on: ${{ matrix.os }}
    # **macOS が落ちても Windows / Linux は配る**（v1 と同じ考え方）。
    #
    # `optional` を立てた組み合わせは、失敗しても `build` 全体を
    # 失敗にしない。**実機が無く確認もできない OS が、確認できる OS の
    # 配布を止めるのはおかしい。**
    #
    # Windows / Linux は `optional` を立てないので、落ちれば `build` が
    # 失敗し、Release は作られない（§1 の「不完全なものを配らない」）。
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      # **1 つ失敗しても他は続ける。** どの OS が駄目なのかを一度に知りたい
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            target: x86_64-unknown-linux-gnu
            binary: mdview
          - os: windows-latest
            label: windows-x86_64
            target: x86_64-pc-windows-msvc
            binary: mdview.exe
          # **macOS は Apple Silicon だけ作る。**
          # Intel Mac 向けは、必要になった時点で足す
          - os: macos-latest
            label: macos-aarch64
            target: aarch64-apple-darwin
            binary: mdview
            # **落ちても配布を止めない**（上の `continue-on-error`）
            optional: true

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Rust ツールチェーンを用意する
        # 版数は rust-toolchain.toml に従う
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Linux のビルド依存を入れる
        if: runner.os == 'Linux'
        # iced（wgpu / winit）が X11 と Wayland のヘッダを要求する
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev pkg-config

      # **同梱フォントはリポジトリに無い**（21.56MB あるため。assets/README.md）
      - name: 同梱フォントのキャッシュ
        id: fonts
        uses: actions/cache@v6
        with:
          path: assets/fonts
          key: fonts-${{ hashFiles('tools/fetch-fonts.py') }}

      - name: 同梱フォントを取得する
        if: steps.fonts.outputs.cache-hit != 'true'
        run: python tools/fetch-fonts.py

      - name: 同梱フォントを確認する
        # **欠けたままビルドしない。** `include_bytes!` で落ち、原因が分かりにくい
        run: python tools/fetch-fonts.py --check

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # **ビルドより先に作る。** `build.rs` が Windows の実行ファイルへ
      # 埋めるため、この時点で `assets/icons/mdview.ico` が要る。
      # リリースと同じプロファイル・同じ target で動かすので、
      # 依存のコンパイルは 1 度で済む
      - name: アイコンを作る
        run: cargo run --release --target ${{ matrix.target }} --example make-icons

      - name: ビルド
        run: cargo build --release --target ${{ matrix.target }}

      - name: 名前を付けて集める
        shell: bash
        # 受け取った側が「どれを落とせばよいか」で迷わないよう、名前に OS と CPU を入れる
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)
          mkdir -p dist
          name="mdview-${version}-${{ matrix.label }}"
          source="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$source" "dist/${name}.exe"
          else
            cp "$source" "dist/${name}"
            chmod +x "dist/${name}"
          fi
          ls -la dist

      # --- Linux の包み（B-5） ---
      #
      # **`bash` を頭に付けて呼ぶ。** 実行ビットに頼らない。
      # Windows では実行ビットを持てず、`git add` で 100644 になる。
      # 実際、2026-10-05 の v2.0.0 で 3 OS すべてが
      # `Permission denied`（終了コード 126）で落ちた。
      # 索引の実行ビットも立て直したが、**公開用の複製を作り直すと再び失われる**
      # ため、呼び方のほうで断つ。
      - name: deb を組む
        if: runner.os == 'Linux'
        run: |
          bash packaging/linux/build-deb.sh \
            "target/${{ matrix.target }}/release/mdview" dist

      - name: AppImage を組む
        if: runner.os == 'Linux'
        run: |
          bash packaging/linux/build-appimage.sh \
            "target/${{ matrix.target }}/release/mdview" dist

      # **入れて・起動して・消せるかを確かめる**（B-8）
      - name: deb の煙試験
        if: runner.os == 'Linux'
        run: |
          set -eu
          package=$(ls dist/*.deb)
          echo "試す: $package"
          # **`dpkg -i` ではなく `apt-get install ./…` で入れる。** 受け取った側と同じ経路にする。
          # `dpkg` は足りない依存を取りに行かず、ランナーに無い依存
          # （v2.1.1 で足した libxkbcommon-x11-0）で設定に失敗していた
          sudo apt-get update >/dev/null
          sudo apt-get install -y "./$package"

          # **実行時に読み込むものが依存から漏れていないか。** 実行ファイルの依存には出ないので、
          # 落とすと X11 の環境で起動直後に落ちる（CI の xvfb で見つかった）
          depends=$(dpkg-deb -f "$package" Depends)
          echo "依存: $depends"
          case "$depends" in *libxkbcommon-x11-0*) ;; *) echo "依存に libxkbcommon-x11-0 が無い"; exit 1;; esac

          test -x /usr/bin/mdview || { echo "入ったはずの実行ファイルが無い"; exit 1; }
          version=$(/usr/bin/mdview --version)
          echo "起動できた: $version"
          case "$version" in mdview\ *) ;; *) echo "版数を返さない: $version"; exit 1;; esac

          # **メニューの定義が妥当か確かめる。** 壊れていると一覧に出ない
          sudo apt-get install -y desktop-file-utils >/dev/null
          desktop-file-validate /usr/share/applications/mdview.desktop

          sudo dpkg -r mdview
          test ! -e /usr/bin/mdview || { echo "消したはずの実行ファイルが残っている"; exit 1; }
          echo "入れて・起動して・消せた"

      - name: AppImage の煙試験
        if: runner.os == 'Linux'
        run: |
          set -eu
          package=$(ls dist/*.AppImage)
          echo "試す: $package"
          # runner に FUSE が無いので展開して動かす
          APPIMAGE_EXTRACT_AND_RUN=1 "$package" --version

      # --- macOS の包み（B-6） ---
      - name: dmg を組む
        if: runner.os == 'macOS'
        run: |
          bash packaging/macos/build-dmg.sh \
            "target/${{ matrix.target }}/release/mdview" dist

      - name: dmg の煙試験
        if: runner.os == 'macOS'
        run: |
          set -eu
          package=$(ls dist/*.dmg)
          echo "試す: $package"
          mount=$(mktemp -d)
          hdiutil attach "$package" -mountpoint "$mount" -nobrowse -quiet

          app="$mount/mdview.app"
          test -d "$app" || { echo "バンドルが無い"; exit 1; }
          editor="$app/Contents/Helpers/mdview.app"
          test -x "$app/Contents/MacOS/mdview" || { echo "起動用が無い"; exit 1; }
          test -x "$editor/Contents/MacOS/mdview" || { echo "本体が無い"; exit 1; }
          test -f "$app/Contents/Resources/mdview.icns" || { echo "アイコンが無い"; exit 1; }
          # **plist が壊れていないか確かめる。** 壊れていると起動すらしない
          plutil -lint "$app/Contents/Info.plist"
          plutil -lint "$editor/Contents/Info.plist"
          # **本体は別のバンドル ID**（同じだと Finder の開く要求が本体へ行く。R-08）
          outer=$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")
          inner=$(plutil -extract CFBundleIdentifier raw "$editor/Contents/Info.plist")
          [ "$outer" != "$inner" ] || { echo "バンドル ID が同じ: $outer"; exit 1; }
          # 本体を直に、そして起動用越しに（引数があれば本体に置き換わる）
          "$editor/Contents/MacOS/mdview" --version
          "$app/Contents/MacOS/mdview" --version | grep -q "^mdview " \
            || { echo "起動用が本体へ引数を渡せない"; exit 1; }

          hdiutil detach "$mount" -quiet
          echo "開いて・起動できた"

      # --- Windows のインストーラ（B-3） ---
      #
      # **署名しない**（§27.4）。受け取った側の警告の外し方は Release の
      # 説明文に入れる
      - name: Inno Setup を入れる
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: インストーラを組む
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          packaging/windows/build-installer.ps1 `
            -SourceExe "target/${{ matrix.target }}/release/mdview.exe" `
            -OutputDir dist

      # **入れて・起動して・消せるかを確かめる**（B-8）。
      # ここを作らないと、壊れたインストーラをそのまま配ることになる。
      # 画面が無いので、起動の確認は `--version` で行う
      - name: 入れて消す煙試験
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          Write-Host "試す: $($setup.Name)"

          Start-Process -FilePath $setup.FullName `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\mdview\mdview.exe"
          if (-not (Test-Path $exe)) { throw "入ったはずの $exe が無い" }

          $version = & $exe --version
          Write-Host "起動できた: $version"
          if ($version -notmatch '^mdview ') { throw "版数を返さない: $version" }

          $uninstall = Get-ChildItem "$env:LOCALAPPDATA\Programs\mdview\unins*.exe" |
            Select-Object -First 1
          Start-Process -FilePath $uninstall.FullName `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "消したはずの $exe が残っている" }
          Write-Host "入れて・起動して・消せた"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release を作る
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: 照合値を作る
        # **署名しないぶん、改ざんの確認手段を添える**（§27.4）
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 説明文を作る
        # **実機で見ていない OS があることを必ず載せる**（リリース手順 §5）。
        # 手で足す決まりにしていたが、ここが自動で作る以上、忘れる。
        # 字形の問題は実際に踏んでおり、省いてよい断り書きではない
        run: |
          # **入っていない OS を説明文に書く**（§1）。
          #
          # macOS は落ちても配布を止めないので、**入っていないことが起こる。**
          # 黙って欠けていると、受け取った側は「まだ上がっていないのか、
          # もう作らないのか」が分からない。
          missing=""
          for label in windows-x86_64 linux-x86_64 macos-aarch64; do
            if ! ls dist/ | grep -q -- "$label"; then
              missing="${missing}${missing:+、}${label}"
            fi
          done
          if [ -n "$missing" ]; then
            {
              echo "> **この版には次の環境向けが入っていません: ${missing}**"
              echo "> 組み立てに失敗したためです。追って別の版で配ります。"
              echo
            } > release-notes.md
          else
            : > release-notes.md
          fi

          cat >> release-notes.md <<'NOTES'
          > **macOS 版は画面を誰も見ていません。**
          > 組み立てと自動試験は通っていますが、実機が無いため、
          > 見た目（字形・描画）は未確認です。
          >
          > **Linux 版は WSLg で画面を確認しています。**
          > 字形・レイアウト・図・数式・画像・導入と削除は見ていますが、
          > **性能・ネイティブ GPU ドライバ・IME・デスクトップ統合は
          > 未確認**です。お気づきの点があればお知らせください。

          ## 受け取った側の手順

          **この配布物には署名がありません。** 初回は OS が警告します。

          | OS | 出るもの | 通し方 |
          | --- | --- | --- |
          | Windows | SmartScreen の警告 | 「詳細情報」→「実行」 |
          | macOS | 「開発元を検証できません」 | `xattr -dr com.apple.quarantine <ファイル>` の後に実行 |
          | Linux | 実行権限が無い | `chmod +x <ファイル>` |

          `SHA256SUMS.txt` で中身を照合できます。

          ## 中身

          - 単一の実行ファイル（ランタイムの導入は要りません）
          - フォントは同梱しています（OFL。全文は実行ファイルに含みます）
          NOTES
          cat release-notes.md

      - name: Release へ載せる
        # **外部のアクションに頼らない。** `gh` はランナーに最初から入っている
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # プレリリース（`-alpha` など）はその印を付ける
          flags=""
          case "$TAG" in
            *-*) flags="--prerelease" ;;
          esac
          gh release create "$TAG" dist/* --title "$TAG" --notes-file release-notes.md $flags
