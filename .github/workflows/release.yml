name: Release

# 3 OS の配布物を作る。
#
# **押すたびには走らせない。** リリースビルドは 3 OS ぶんで 30 分以上かかる。
#
#   - `v<major>.<minor>.0` のタグ（プレリリース `-alpha.1` 等を含む）
#     = **マイナー以上の更新のときだけ**自動で走る
#   - それ以外（緊急のパッチ配布など）は「Actions」から手動で起動する
#
# **署名はしない。** 受け取った側の警告の外し方は Release の説明文に入れる。

on:
  push:
    tags:
      # v2.1.0 / v2.1.0-alpha.1 は当たる。v2.1.3 は当たらない（手動で起動する）
      - "v[0-9]+.[0-9]+.0"
      - "v[0-9]+.[0-9]+.0-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "配布するタグ（例: v2.0.1）。空なら起動したブランチの先頭を使う"
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ビルド（${{ matrix.label }}）
    runs-on: ${{ matrix.os }}
    strategy:
      # **1 つ失敗しても他は続ける。** どの OS が駄目なのかを一度に知りたい
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            target: x86_64-unknown-linux-gnu
            binary: mdview
          - os: windows-latest
            label: windows-x86_64
            target: x86_64-pc-windows-msvc
            binary: mdview.exe
          # **macOS は Apple Silicon だけ作る。**
          # Intel Mac 向けは、必要になった時点で足す
          - os: macos-latest
            label: macos-aarch64
            target: aarch64-apple-darwin
            binary: mdview

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Rust ツールチェーンを用意する
        # 版数は rust-toolchain.toml に従う
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Linux のビルド依存を入れる
        if: runner.os == 'Linux'
        # iced（wgpu / winit）が X11 と Wayland のヘッダを要求する
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev pkg-config

      # **同梱フォントはリポジトリに無い**（21.56MB あるため。assets/README.md）
      - name: 同梱フォントのキャッシュ
        id: fonts
        uses: actions/cache@v6
        with:
          path: assets/fonts
          key: fonts-${{ hashFiles('tools/fetch-fonts.py') }}

      - name: 同梱フォントを取得する
        if: steps.fonts.outputs.cache-hit != 'true'
        run: python tools/fetch-fonts.py

      - name: 同梱フォントを確認する
        # **欠けたままビルドしない。** `include_bytes!` で落ち、原因が分かりにくい
        run: python tools/fetch-fonts.py --check

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: ビルド
        run: cargo build --release --target ${{ matrix.target }}

      - name: 名前を付けて集める
        shell: bash
        # 受け取った側が「どれを落とせばよいか」で迷わないよう、名前に OS と CPU を入れる
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)
          mkdir -p dist
          name="mdview-${version}-${{ matrix.label }}"
          source="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$source" "dist/${name}.exe"
          else
            cp "$source" "dist/${name}"
            chmod +x "dist/${name}"
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release を作る
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 照合値を作る
        # **署名しないぶん、改ざんの確認手段を添える**
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 説明文を作る
        run: |
          cat > release-notes.md <<'NOTES'
          ## 受け取った側の手順

          **この配布物には署名がありません。** 初回は OS が警告します。

          | OS | 出るもの | 通し方 |
          | --- | --- | --- |
          | Windows | SmartScreen の警告 | 「詳細情報」→「実行」 |
          | macOS | 「開発元を検証できません」 | `xattr -dr com.apple.quarantine <ファイル>` の後に実行 |
          | Linux | 実行権限が無い | `chmod +x <ファイル>` |

          `SHA256SUMS.txt` で中身を照合できます。

          ## 中身

          - 単一の実行ファイル（ランタイムの導入は要りません）
          - フォントは同梱しています（OFL。全文は実行ファイルに含みます）
          NOTES
          cat release-notes.md

      - name: Release へ載せる
        # **外部のアクションに頼らない。** `gh` はランナーに最初から入っている
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # プレリリース（`-alpha` など）はその印を付ける
          flags=""
          case "$TAG" in
            *-*) flags="--prerelease" ;;
          esac
          gh release create "$TAG" dist/* --title "$TAG" --notes-file release-notes.md $flags
