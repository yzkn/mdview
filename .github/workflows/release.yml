name: Release

# **作り直し用**（2026-10-13）。ふだんの配布は CI（ci.yml）の release ジョブが、
# main への push で版数が新しいときに自動で行う。ここは手で起動したときだけ走る。
#
# 使うのは、Release を消して作り直したいときなど。タグのコミットで走った CI を探し
# （走っていれば終わるまで待つ）、その配布物（`dist-<OS>`）を落として載せる。
# **ここでは組まない。** CI の成果物は 90 日で消えるので、古いタグは CI を起こし直す。
#
# 検査・照合値・説明文は CI と同じスクリプト（tools/release/make-release.sh）で作る。
# **Windows がそろっていれば配る**（Linux / macOS が欠けたら説明文に書く）。
#
# **署名はしない**（§27.4）。受け取った側の警告の外し方は Release の説明文に入れる。

on:
  # **タグでは走らせない。** タグは CI の release ジョブが打つ
  workflow_dispatch:
    inputs:
      tag:
        # **空を許さない。** 空だと Release の名前とタグが枝の名前（`main`）になる
        description: "配布するタグ（例: v2.1.3）。先に push しておくこと"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  # Release を作る
  contents: write
  # CI の実行と、その配布物を読む
  actions: read

jobs:
  release:
    name: Release を作る
    runs-on: ubuntu-latest
    # CI の終わりを待つことがある（3 OS の組み立てと GUI 試験で 1 時間ほど）
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # **タグのコミットで走った CI を探し、終わるまで待つ。**
      #
      # push の直後は CI がまだ一覧に出ていないことがあるので、出てくるまで少し待つ
      - name: CI の配布物を落とす
        run: |
          set -eu
          sha=$(git rev-parse HEAD)
          echo "タグのコミット: $sha"
          run_id=""
          for attempt in $(seq 1 20); do
            # PR の実行は除く（PR の先頭がたまたま同じコミットでも、main の CI を使う）
            run_id=$(gh run list --workflow ci.yml --commit "$sha" --limit 20 \
              --json databaseId,event \
              --jq '[.[] | select(.event != "pull_request")][0].databaseId // empty')
            [ -n "$run_id" ] && break
            echo "このコミットの CI がまだ見つからない（$attempt / 20）。30 秒待つ"
            sleep 30
          done
          if [ -z "$run_id" ]; then
            echo "このコミット（$sha）で走った CI が無い。main へ push したか確かめる（手で CI を起動してもよい）"
            exit 1
          fi
          echo "CI の実行: $run_id"
          # 終わるまで待つ。**成否はここでは見ない**（Linux / macOS が落ちても Windows がそろえば配るため。下で見る）
          gh run watch "$run_id" --interval 60 > /dev/null || true
          gh run view "$run_id" --json conclusion,jobs \
            --jq '"CI の結果: \(.conclusion)", (.jobs[] | "  \(.conclusion)\t\(.name)")'
          gh run download "$run_id" --pattern 'dist-*' --dir artifacts
          mkdir -p dist
          find artifacts -type f -exec mv -t dist {} +
          ls -la dist

      # **CI と同じスクリプトで作る**（タグと版数・Windows がそろっているか・
      # 版数の混ざり・照合値・説明文）
      - name: 検査・照合値・説明文
        run: bash tools/release/make-release.sh "$TAG" dist

      - name: Release へ載せる
        # **外部のアクションに頼らない。** `gh` はランナーに最初から入っている
        run: |
          # プレリリース（`-alpha` など）はその印を付ける
          flags=""
          case "$TAG" in
            *-*) flags="--prerelease" ;;
          esac
          # **下書きで作って全部載せてから、公開する**（ci.yml の release ジョブと同じ）。
          # 載せている途中で止まっても、欠けた Release が公開されない
          gh release create "$TAG" dist/* --draft --verify-tag             --title "$TAG" --notes-file release-notes.md $flags
          gh release edit "$TAG" --draft=false
