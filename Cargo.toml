[package]
name = "mdview"
version = "2.1.1"
description = "Markdown viewer and editor"
authors = []
edition = "2021"
publish = false

[dependencies]
# 本文の保持。10MB の文書を扱うため、文字列全体を作り直さない（§12.1）
ropey = "1.6"
# UI（DEC-202）。描画・入力・IME を担う
# advanced: 自前ウィジェット（EditorView）を書くために要る。
# 既製のウィジェットは 10MB に耐えないため自前実装が前提（§6）。
# image: 図・数式・画像を画素で描くために要る（§16.12）
iced = { version = "0.14", features = ["advanced", "tokio", "image"] }
# UAX #14 の行分割規則。日本語の基本的な禁則はここに含まれる（§3.2）
unicode-linebreak = "0.1"
# レイアウトキャッシュ（§3.8）
lru = "0.18"
# Markdown の解析（DEC-203）。可視範囲のインライン要素と、出力用の全文解析に使う。
# 既定の機能だけで足りる（HTML 出力は使わない。§12.7）
comrak = { version = "0.55", default-features = false }
# コードブロックの着色（DEC-211）。構文定義 75 種が最初から入る。
# **テーマは入れない。** 色は役割で持ち描画時に解決するため（§16.10）。
# 正規表現は fancy-regex（純 Rust）を使う。onig は C の依存が増え、
# 単一実行ファイル（+crt-static）と 3 OS のビルドを面倒にする
syntect = { version = "5.3", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-fancy",
] }
# Mermaid の図（DEC-207）。v1 と同じ mermaid 11.17.2 に追従する純 Rust 実装
merman = "0.8.0-alpha.6"
# SVG のラスタライズ。画面表示と PDF 出力の双方で要る
resvg = "0.48"
# merman のサイト設定（htmlLabels の一括無効化）を JSON で渡すため
serde_json = "1"
# LaTeX 数式（DEC-210）。出力はすべて <path> で、描画に外部フォントが要らない
latex-rust = "1.0"
# 画像のデコード（§16.12）。**ネットワーク機能は使わない**
# 既定の機能を切り、文書で使う形式だけ入れる
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "webp",
] }
# ファイル選択と確認のダイアログ（§14.1 / §18.2）。
# **OS のものを使う。** 自前で描くと入力補完やネットワークの場所を作り直すことになる
rfd = "0.17"
# OS の外観（Light / Dark）の取得。iced は内部で追うがアプリへ渡す口が無い
dark-light = "3"
# 検索・置換の正規表現（§8.2）。**後戻りしない実装**を選ぶ。
# fancy-regex（syntect が使う）は先読みが書けるが、書き方次第で
# 10MB の文書に対して事実上終わらない照合になりうる
regex = "1"
# 日付・時刻の差し込み（TeraPad 相当）。**端末の時刻帯が要る**ため。
# std だけでは地方時を出せない。既定の機能を切って clock だけ入れる
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 文字コードの変換（利用者の要望。TeraPad に準じる）。
# Shift_JIS / EUC-JP / ISO-2022-JP / UTF-16 を読み書きする。
# **判定は自前**（§19.4）。encoding_rs は変換だけを担う
encoding_rs = "0.8"
# PDF の生成（DEC-205）。v1 の WebView 印刷に依存しない。
# **同梱フォントをそのまま埋め込む**（サブセット化は krilla が行う。§8.5）
krilla = "0.8"
# クリップボードの画像を読む（v2.1.0 R-17）。**iced のクリップボードは文字しか扱えない**。
# 既定の機能は画像の読み書きだけで、ネットワークには出ない
arboard = { version = "3.6", default-features = false, features = ["image-data"] }

[build-dependencies]
# Windows の実行ファイルへアイコンと版数を埋める（B-2）。
# **他の OS では何もしない**（build.rs が target_os を見る）
embed-resource = "3"

[dev-dependencies]
# 印に使う字の送り幅を測る（examples/check-marks.rs）。
# **実行ファイルには入らない。** resvg が同じ版を使っているので増えない
ttf-parser = "0.25"


# 計測は必ずリリース相当の最適化で行う（§9.4）
# 試験と開発ビルドのデバッグ情報は**行番号だけ**にする。
#
# 既定（debug = 2）では、このクレートを 1 つの試験用実行ファイルへまとめる
# ときに rustc が数 GB を要求し、手元の端末でコミット不足になって
# `STATUS_STACK_BUFFER_OVERRUN` で落ちる（§10.39）。
# 行番号があればパニックの場所は分かるため、失うものは少ない。
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
